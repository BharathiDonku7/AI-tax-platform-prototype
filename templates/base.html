<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Return Review{% endblock %} · GreenGrowth</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0f172a; }
  body { font-family:'Inter',system-ui,sans-serif; color:var(--ink); }
  .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .hatch { background-image:repeating-linear-gradient(45deg,rgba(100,116,139,.07) 0 6px,transparent 6px 12px); }
  [x-cloak] { display:none !important; }
  ::-webkit-scrollbar { width:10px;height:10px }
  ::-webkit-scrollbar-thumb { background:#cbd5e1;border-radius:8px }
</style>
</head>
<body class="bg-slate-50 antialiased">

<header class="bg-white border-b border-slate-200 sticky top-0 z-40">
  <div class="px-5 h-14 flex items-center gap-6">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded bg-emerald-600 grid place-items-center text-white font-bold text-xs">GG</div>
      <span class="font-semibold text-sm tracking-tight">GreenGrowth</span>
    </div>
    <nav class="flex items-center gap-1 text-sm">
      {% for key,label in [('review','Return Review'),('queue','Review Queue'),('legend','Interaction System')] %}
      <a href="{{ url_for(key) }}"
         class="px-3 py-1.5 rounded-md transition
                {% if active_page==key %}bg-slate-900 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
        {{ label }}
      </a>
      {% endfor %}
    </nav>
    <div class="ml-auto flex items-center gap-3 text-xs">
      <span class="px-2 py-1 rounded bg-amber-50 text-amber-800 ring-1 ring-amber-200 font-medium">
        Prototype · all data simulated
      </span>
      <div class="flex items-center gap-2 pl-3 border-l border-slate-200">
        <div class="w-6 h-6 rounded-full bg-slate-700 grid place-items-center text-white text-[10px] font-semibold">MR</div>
        <span class="text-slate-600">M. Reyes, CPA</span>
      </div>
    </div>
  </div>
</header>

{% block body %}{% endblock %}
</body>
</html>
